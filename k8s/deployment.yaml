apiVersion: apps/v1
kind: Deployment
metadata:
  name: mp231-api
  labels:
    app: mp231-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: mp231-api
  template:
    metadata:
      labels:
        app: mp231-api
    spec:
      containers:
        - name: mp231-api
          image: mp231-api:1.0
          ports:
            - containerPort: 8000
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 15
            failureThreshold: 3
